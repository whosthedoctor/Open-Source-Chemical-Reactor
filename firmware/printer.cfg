# ============================================================================
# Open-Source Chemical Reactor - Klipper configuration
# ============================================================================
# Controller : BigTreeTech Octopus Pro V1.1 (STM32H723)
# Host       : Raspberry Pi 4 running Klipper - the Python sequencer talks to
#              Klipper over its API socket to run reaction programs.
# Machine    : Ender 3 gantry repurposed as a cube handler. 200 x 200 x 200 mm
#              work volume = an 8x8x8 grid of 25 mm cubes.
#
# Building the MCU firmware (on the Pi, from the klipper source tree):
#   make menuconfig -> enable low-level configuration options,
#   STM32H723, 128KiB bootloader, 25 MHz crystal, USB communication.
#   Flash via SD card (firmware.bin -> FIRMWARE.CUR) or DFU.
#
# STATUS: design-stage configuration. Written against the official Klipper
# Octopus Pro v1.1 pin map, NOT yet tested on hardware. Verify every pin,
# current and direction against the physical build before powering cubes.
#
# ---------------------------------------------------------------------------
# WIRING MAP (Octopus Pro v1.1 outputs -> reactor loads)
# ---------------------------------------------------------------------------
#   Driver 0 (MOTOR0)  X axis stepper            uart PC4
#   Driver 1 (MOTOR1)  Y axis stepper            uart PD11
#   Driver 2 (MOTOR2)  Z axis stepper            uart PC6
#   Driver 3 (MOTOR3)  Grabber rotation stepper  uart PC7
#   Driver 4 (MOTOR4)  Grabber lift stepper      uart PF2
#   HE0 (PA0) / T0 (PF4)   Heater cube 1 cartridge + its NTC thermistor
#   HE1 (PA3) / T1 (PF5)   Heater cube 2 cartridge + its NTC thermistor
#   BED (PA1)              Peltier cube (biggest MOSFET on the board).
#                          Fixed polarity - fit an H-bridge module if the
#                          Peltier ever needs to heat as well as cool.
#   FAN1 (PE5)             Peristaltic pump 1 (PWM speed = dosing rate)
#   FAN2 (PD12)            Peristaltic pump 2
#   FAN3 (PD13)            Solenoid valve 1
#   FAN4 (PD14)            Solenoid valve 2
#   FAN5 (PD15)            Controller/box fan
#   FAN0 (PA8)             Photochemical cube LED array (via pogo-pin bus)
#   RGB (PB10)             Vacuum waste solenoid (via pogo-pin bus)
#
# Power: the Ender 3's own 24 V PSU feeds the board. The 12 V loads (pumps,
# valves, cartridges, Peltier) run from the board's fan/heater outputs with
# the Octopus output-voltage jumpers set accordingly, or through a 24->12 V
# buck converter. Heater and Peltier outputs land on whichever cube is
# docked - they are routed through the pogo-pin power bus, so "heater_cube_1"
# below means "the heater cube currently connected to bus channel 1".
# ============================================================================

[mcu]
# TODO: replace with the real id from `ls /dev/serial/by-id/` after flashing.
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_000000000000-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 200          # keep it gentle - the gantry carries glassware-adjacent cubes
max_accel: 1500
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# ---------------------------------------------------------------------------
# Gantry steppers (Ender 3 mechanics: GT2/20T on X/Y, T8 lead screw on Z)
# ---------------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0.5
position_min: 0
position_max: 200
homing_speed: 8

[tmc2209 stepper_x]
uart_pin: PC4
run_current: 0.75
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD11
run_current: 0.75
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.6
stealthchop_threshold: 999999

# ---------------------------------------------------------------------------
# Carriage grabber - 2 extra axes on spare drivers
# ---------------------------------------------------------------------------
# Rotation of the magnetic manipulator head (degrees are faked through
# rotation_distance for now - calibrate steps/degree on the real head).
[manual_stepper grabber_rot]
step_pin: PG4
dir_pin: PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 40
velocity: 25
accel: 200

[tmc2209 manual_stepper grabber_rot]
uart_pin: PC7
run_current: 0.5
stealthchop_threshold: 999999

# Short vertical axis that seats the grabber onto a cube / lifts it clear.
[manual_stepper grabber_lift]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
microsteps: 16
rotation_distance: 8
velocity: 8
accel: 60

[tmc2209 manual_stepper grabber_lift]
uart_pin: PF2
run_current: 0.5
stealthchop_threshold: 999999

# ---------------------------------------------------------------------------
# Heater cubes (cartridge + NTC on the pogo bus). Conservative limits:
# PETG structure softens well below these temps - 120 C is a hard ceiling,
# and verify_heater shuts the machine down if a thermistor lies.
# ---------------------------------------------------------------------------
[heater_generic heater_cube_1]
heater_pin: PA0
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 120

[heater_generic heater_cube_2]
heater_pin: PA3
sensor_pin: PF5
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 120

[verify_heater heater_cube_1]
max_error: 8
check_gain_time: 30
hysteresis: 5
heating_gain: 1

[verify_heater heater_cube_2]
max_error: 8
check_gain_time: 30
hysteresis: 5
heating_gain: 1

# ---------------------------------------------------------------------------
# Peltier cube - driven as a PWM "fan" off the bed MOSFET.
# SET_FAN_SPEED FAN=peltier SPEED=0..1 sets cooling power.
# ---------------------------------------------------------------------------
[fan_generic peltier]
pin: PA1
max_power: 1.0
shutdown_speed: 0          # fail-safe: Peltier OFF on MCU shutdown

# ---------------------------------------------------------------------------
# Fluid handling
# ---------------------------------------------------------------------------
[fan_generic pump_1]
pin: PE5
shutdown_speed: 0

[fan_generic pump_2]
pin: PD12
shutdown_speed: 0

[output_pin valve_1]
pin: PD13

[output_pin valve_2]
pin: PD14

[output_pin vacuum_waste]
pin: PB10

[output_pin photochemical_leds]
pin: PA8

[controller_fan board_fan]
pin: PD15
heater: heater_cube_1, heater_cube_2

# ---------------------------------------------------------------------------
# Convenience macros for the sequencer / manual testing
# ---------------------------------------------------------------------------
[gcode_macro PICK_CUBE]
description: Placeholder - move gantry over a grid slot, lower grabber, lift
gcode:
    # Filled in once the grabber geometry is final. Grid slot (col,row) ->
    # X = col*25 + 12.5, Y = row*25 + 12.5 (cube centres on the 8x8 grid).
    {action_respond_info("PICK_CUBE not implemented yet - grabber geometry TBD")}

[gcode_macro RUN_WASH]
description: Placeholder - flush lines to waste and purge with gas
gcode:
    {action_respond_info("RUN_WASH not implemented yet")}

[gcode_macro ALL_OFF]
description: Kill every load - heaters, Peltier, pumps, valves, LEDs
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_cube_1 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_cube_2 TARGET=0
    SET_FAN_SPEED FAN=peltier SPEED=0
    SET_FAN_SPEED FAN=pump_1 SPEED=0
    SET_FAN_SPEED FAN=pump_2 SPEED=0
    SET_PIN PIN=valve_1 VALUE=0
    SET_PIN PIN=valve_2 VALUE=0
    SET_PIN PIN=vacuum_waste VALUE=0
    SET_PIN PIN=photochemical_leds VALUE=0
    M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
