# ============================================================================
# Open-Source Chemical Reactor - Klipper configuration
# ============================================================================
# Controller : BIGTREETECH Manta M5P V1.0 (STM32G0B1, 64 MHz)
# Host       : CB1 module on the board's BTB headers (M5P requires a
#              CM4-form-factor host - no external USB host can reach the MCU)
# Machine    : Ender 3 gantry repurposed as a cube handler. 200 x 200 x 200 mm
#              work volume = an 8x8x8 grid of 25 mm cubes.
#
# Building the MCU firmware (on the host, from the klipper source tree):
#   make menuconfig -> enable low-level configuration options,
#   STM32G0B1, 8KiB bootloader, 8 MHz crystal, USB (on PA11/PA12).
#   Flash via SD card (firmware.bin -> FIRMWARE.CUR) or DFU.
# Pin map: Klipper's generic-bigtreetech-manta-m5p.cfg (official).
#
# STATUS: design-stage configuration. NOT yet tested on hardware. Verify
# every pin, current and direction against the physical build before
# powering cubes.
#
# ---------------------------------------------------------------------------
# WIRING MAP (Manta M5P) - verified against the official M5P user manual
# ---------------------------------------------------------------------------
#   Motor1 (X)      X axis stepper            uart PD9,  endstop PD3
#   Motor2 (Y)      Y axis stepper            uart PD8,  endstop PD2
#   Motor3 (Z)      Z axis stepper            uart PB10, endstop PC3
#   Motor4          Magnet head rotation stepper  uart PB2  (NEMA11, 0.67 A)
#   Motor5          Magnet head lift stepper      uart PA6  (NEMA11, 0.67 A)
#   HE0 (PC5) / TH0 (PA1)   Heater cube 1 cartridge (24 V) + NTC
#   HE1 (PA7) / TH1 (PA2)   Heater cube 2 cartridge (24 V) + NTC
#   HB  (PA5) / TB  (PA0)   UNUSED (Peltier moved to PC13 + MOSFET)
#   FAN0 (PA4)  Pump 1  - CNC fan port, jumper set to 12 V
#   FAN1 (PA3)  Pump 2  - CNC fan port, jumper set to 12 V
#   PC13 (BLTouch pin, repurposed)  Peltier cube via MOSFET module,
#               power from the dedicated 24 V -> 12 V buck rail
#   EXP1 pins   Valve 1 (PD5), valve 2 (PB3), vacuum (PB5), LEDs (PB7)
#               LOGIC-LEVEL ONLY: these drive an external MOSFET module,
#               they are not 12 V power outputs.
#
# 12 V STORY (the important part) - HYBRID RAIL, decided 2026-10-24:
#   The M5P's CNC fan outputs (FAN0, FAN1, PI-FAN) are jumper-selectable
#   5 V / 12 V / 24 V - the manual says so explicitly ("no more need for
#   external stepdown"). So pumps and anything else on FAN0/FAN1 run at
#   12 V straight off the 24 V Ender 3 PSU, no buck converter needed.
#   Limits: 1 A continuous per fan port, 2.5 A total across all fan ports.
#   Heater outputs (HE0, HE1) follow the main VIN rail = 24 V, so the
#   heater cubes use 24 V 40 W cartridges - no buck needed for heaters.
#   The Peltier is a 12 V TEC, so it runs on its own dedicated rail: a
#   24 V -> 12 V 10 A buck feeding an external MOSFET module, switched
#   by PC13 (the BLTouch servo pin, repurposed - no probe on this
#   machine). One Peltier cube at a time (6 A max draw). HB is unused.
#   The M5P only has TWO controllable CNC fan outputs (FAN0, FAN1) -
#   valves, vacuum and LEDs therefore go through EXP logic pins + a
#   MOSFET module, as mapped above.
#
# WIRE GAUGE:
#   The 28 AWG silicone wire is for signals only (endstops, thermistors,
#   pogo-pin signal lines, LEDs). Heater runs (1.7 A each at 24 V) and the
#   Peltier (~5-6 A at 12 V) need 18 AWG or heavier. Do not run heater
#   current through 28 AWG.
# ============================================================================

[mcu]
# TODO: replace with the real id from `ls /dev/serial/by-id/` after flashing.
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_000000000000-if00
restart_method: command

# Uncomment if the host is a CB1 and you want its GPIO as Klipper outputs.
# (Requires the host MCU service: /tmp/klipper_host_mcu)
# [mcu CB1]
# serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 200          # keep it gentle - the gantry carries chemistry
max_accel: 1500
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

# ---------------------------------------------------------------------------
# Gantry steppers (Ender 3 mechanics: GT2/20T on X/Y, T8 lead screw on Z)
# Endstops: HESAI mechanical switches (with pull-up ^, as in the stock config)
# ---------------------------------------------------------------------------
[stepper_x]
step_pin: PC8
dir_pin: !PC9
enable_pin: !PA15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD3
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40

[stepper_y]
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 40

[stepper_z]
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
endstop_pin: ^PC3
position_endstop: 0.0
position_min: 0
position_max: 200
homing_speed: 8

[tmc2209 stepper_x]
uart_pin: PD9
run_current: 0.75
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: PD8
run_current: 0.75
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: PB10
run_current: 0.6
stealthchop_threshold: 999999

# ---------------------------------------------------------------------------
# Magnet head - 2 extra axes on Motor4/Motor5 (no gripper fingers)
# Motors: STEPPERONLINE NEMA11, 0.67 A rated - run_current kept under that.
# Head: printed cup + Ø14 magnet grabs the cube's top steel disc.
# ---------------------------------------------------------------------------
[manual_stepper grabber_rot]
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
velocity: 25
accel: 200

[tmc2209 manual_stepper grabber_rot]
uart_pin: PB2
run_current: 0.6
stealthchop_threshold: 999999

[manual_stepper grabber_lift]
step_pin: PB0
dir_pin: PB1
enable_pin: !PC4
microsteps: 16
rotation_distance: 8
velocity: 8
accel: 60

[tmc2209 manual_stepper grabber_lift]
uart_pin: PA6
run_current: 0.6
stealthchop_threshold: 999999

# ---------------------------------------------------------------------------
# Heater cubes (24 V cartridge + NTC on the pogo bus). Conservative limits:
# PETG structure softens well below these temps - 120 C is a hard ceiling,
# and verify_heater shuts the machine down if a thermistor lies.
# HE0/HE1 follow VIN (24 V) - heater cubes use 24 V 40 W cartridges, so
# this is correct as wired. Do NOT connect 12 V cartridges here.
# ---------------------------------------------------------------------------
[heater_generic heater_cube_1]
heater_pin: PC5
sensor_pin: PA1
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 120

[heater_generic heater_cube_2]
heater_pin: PA7
sensor_pin: PA2
sensor_type: EPCOS 100K B57560G104F
control: pid
pid_Kp: 21.527
pid_Ki: 1.063
pid_Kd: 108.982
min_temp: 0
max_temp: 120

[verify_heater heater_cube_1]
max_error: 8
check_gain_time: 30
hysteresis: 5
heating_gain: 1

[verify_heater heater_cube_2]
max_error: 8
check_gain_time: 30
hysteresis: 5
heating_gain: 1

# ---------------------------------------------------------------------------
# Peltier cube - 12 V TEC on its own buck rail.
# Switched by an external MOSFET module from PC13 (BLTouch servo pin,
# repurposed). The module's power input comes from the dedicated
# 24 V -> 12 V 10 A buck, NOT from HB. SET_FAN_SPEED FAN=peltier
# SPEED=0..1 sets cooling power. One Peltier cube at a time (6 A max).
# ---------------------------------------------------------------------------
[fan_generic peltier]
pin: PC13
max_power: 1.0
shutdown_speed: 0          # fail-safe: Peltier OFF on MCU shutdown

# ---------------------------------------------------------------------------
# Fluid handling - pumps on the 12 V-jumpered CNC fan outputs.
# Fan port limits: 1 A continuous each, 2.5 A total across fan ports.
# ---------------------------------------------------------------------------
[fan_generic pump_1]
pin: PA4
shutdown_speed: 0

[fan_generic pump_2]
pin: PA3
shutdown_speed: 0

# Valves / vacuum / LEDs: EXP logic pins -> external MOSFET module.
# These pins cannot power a 12 V load directly.
[output_pin valve_1]
pin: PD5

[output_pin valve_2]
pin: PB3

[output_pin vacuum_waste]
pin: PB5

[output_pin photochemical_leds]
pin: PB7

# ---------------------------------------------------------------------------
# Convenience macros for the sequencer / manual testing
# ---------------------------------------------------------------------------
[gcode_macro PICK_CUBE]
description: Placeholder - magnet-head pick: lower head onto cube, lift, move, rotate, lower, lift away
gcode:
    # Magnet head: no fingers - head magnet grabs the cube's top steel disc.
    # Grid slot (col,row) -> X = col*25 + 12.5, Y = row*25 + 12.5 (cube centres on the 8x8 grid).
    # Release needs no actuator: grid side-magnets hold the cube while the head lifts away
    # (stripper ring knocks it off if it ever sticks).
    {action_respond_info("PICK_CUBE not implemented yet - magnet head geometry TBD")}

[gcode_macro RUN_WASH]
description: Placeholder - flush lines to waste and purge with gas
gcode:
    {action_respond_info("RUN_WASH not implemented yet")}

[gcode_macro ALL_OFF]
description: Kill every load - heaters, Peltier, pumps, valves, LEDs
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_cube_1 TARGET=0
    SET_HEATER_TEMPERATURE HEATER=heater_cube_2 TARGET=0
    SET_FAN_SPEED FAN=peltier SPEED=0
    SET_FAN_SPEED FAN=pump_1 SPEED=0
    SET_FAN_SPEED FAN=pump_2 SPEED=0
    SET_PIN PIN=valve_1 VALUE=0
    SET_PIN PIN=valve_2 VALUE=0
    SET_PIN PIN=vacuum_waste VALUE=0
    SET_PIN PIN=photochemical_leds VALUE=0
    M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]
